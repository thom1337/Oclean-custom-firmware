# Builds the app image (build/oclean_custom.bin) on every push, pull request and manual
# run, and attaches it to a GitHub release when a v* tag is pushed. Only the app image is
# published: the brush keeps its stock partition table and bootloader (see README).
name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # untagged builds take their app version from git describe

      # Info page 0 shows the app version only in the form a.b.c.d, one digit each
      # (main/oem_glue.c fw_version_set); anything else shows as V0.0.0.0.
      - name: Set the app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "$ver" > version.txt
          if [[ ! "$ver" =~ ^[0-9]\.[0-9]\.[0-9]\.[0-9] ]]; then
            echo "::warning::version $ver is not a.b.c.d (one digit each): the brush's info page will show V0.0.0.0"
          fi

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      # The build's own size check goes by partitions.csv (0x300000 slots); the brush
      # keeps the stock table, whose app slots are 0x180000 bytes.
      - name: Check the image
        run: |
          size=$(stat -c %s build/oclean_custom.bin)
          slot=$((0x180000))
          echo "image $size bytes, stock app slot $slot bytes"
          if (( size > slot )); then
            echo "::error::build/oclean_custom.bin does not fit the brush's app slot"
            exit 1
          fi
          python3 flash/espimg.py verify build/oclean_custom.bin | tee verify.txt
          if grep -q MISMATCH verify.txt; then
            echo "::error::build/oclean_custom.bin has a bad checksum or SHA-256"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: build/oclean_custom.bin
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum oclean_custom.bin > oclean_custom.bin.sha256
          gh release create "$GITHUB_REF_NAME" oclean_custom.bin oclean_custom.bin.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes --notes-file - <<EOF
          \`oclean_custom.bin\` is the app image for an app-only update:
          - **Brush already on the custom firmware:** web UI → Firmware tab, or
            \`curl -u oclean -H 'Content-Type: application/octet-stream' --data-binary @oclean_custom.bin http://<ip>/api/ota\`
            (curl asks for the web password; with none set, press Enter)
          - **Brush on the stock firmware (first install):** see
            [flash/README.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/flash/README.md).

          **Updating from v1.0.0.0 (it has no web UI password):** from v1.1.0.0 on, the brush
          joins your Wi-Fi only once a web UI password is set. So after this update a v1.0.0.0
          brush leaves your network (its Firmware tab ends with "the device has not come back";
          MQTT / Home Assistant go offline) and comes up as the \`oclean-setup\` access point,
          WPA3 only since v1.1.0.0, with a new 9-digit code on its screen (press the button if
          the screen is dark). You need the brush in hand and a phone or laptop that can join a
          WPA3 network: Android 10 / iOS 13 or later and Wi-Fi hardware that supports WPA3
          (iPhone 7 or later; not every Android 10 phone). Check this before you update. Join
          \`oclean-setup\`, open http://192.168.4.1 (it opens on Settings), set a web UI
          password of 12–64 characters and Save: the brush keeps its Wi-Fi settings and joins
          your network again. Open it there by its IP address (host names get 403) and log in.
          From then on the web UI, curl and scripts need the password.

          Never flash it over UART together with a partition table: the OEM pictures live
          only in a flash partition on the brush that this repository's table would overwrite.
          EOF
